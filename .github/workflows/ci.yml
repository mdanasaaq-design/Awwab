name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Web typecheck
        run: npm run web:typecheck

      - name: Web build
        run: npm run web:build

      - name: Functions typecheck
        run: npm run functions:typecheck

      - name: Functions build
        run: npm run functions:build

      - name: Shared contract typecheck
        run: npm run shared:typecheck

      - name: Firestore Security Rules tests
        run: npm run firebase:rules:test
