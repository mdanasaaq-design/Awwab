name: Generate npm lockfile

on:
  pull_request:

permissions:
  contents: write
  actions: read

concurrency:
  group: lockfile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Retrieve the successfully generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: generated-package-lock
          run-id: 38888952886
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: .
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add npm lockfile"
          git push origin HEAD:${{ github.head_ref }}
